[package]
name = "rustafari-storage"
version = "0.1.0"
edition = "2021"
description = "Storage engine: B-tree pages, WAL, buffer pool for RustafariDB"

[dependencies]
rustafari-core = { path = "../rustafari-core" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.0"
memmap2 = "0.9"
parking_lot = "0.12"
serde_json = "1.0"
