[package]
name = "rustafari-lake"
version = "0.1.0"
edition = "2021"
description = "Parquet and Iceberg data lake integration for RustafariDB"

[dependencies]
rustafari-core = { path = "../rustafari-core" }
arrow = { version = "55", features = ["json"] }
parquet = { version = "55", features = ["arrow"] }
object_store = "0.10"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util"] }
