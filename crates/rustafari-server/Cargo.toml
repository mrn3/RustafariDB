[package]
name = "rustafari-server"
version = "0.1.0"
edition = "2021"
description = "Server, CLI, and entrypoint for RustafariDB"

[dependencies]
rustafari-core = { path = "../rustafari-core" }
rustafari-storage = { path = "../rustafari-storage" }
rustafari-index = { path = "../rustafari-index" }
rustafari-sql = { path = "../rustafari-sql" }
rustafari-document = { path = "../rustafari-document" }
rustafari-executor = { path = "../rustafari-executor" }
rustafari-lake = { path = "../rustafari-lake" }
tokio = { version = "1", features = ["full"] }
tonic = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = "17"
