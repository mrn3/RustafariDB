[package]
name = "rustafari-core"
version = "0.1.0"
edition = "2021"
description = "Core types, storage abstractions, and transaction management for RustafariDB"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
